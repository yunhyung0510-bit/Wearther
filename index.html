<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Wearcast — 여행 코디 플래너</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap');
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: #FAFAF7;
    color: #17181A;
    font-family: 'Noto Sans KR', -apple-system, 'Apple SD Gothic Neo', sans-serif;
  }
  .spin { animation: spin .9s linear infinite; transform-origin: center; }
  @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
  .leaflet-container { font-family: inherit; }
  .ac-pin { background: transparent; border: none; }
  input:focus { outline: 2px solid #3C5A48; outline-offset: 1px; }
  input[type="date"]::-webkit-calendar-picker-indicator { cursor: pointer; }
  a { text-decoration: none; }
  button { font-family: inherit; }
</style>
</head>
<body>
<div id="root"></div>

<script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/8.0.4/babel.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>

<script type="text/babel" data-presets="react">
const { useState, useEffect, useRef, useMemo, useCallback } = React;

/* ────────────────────────────────────────────────────────────────
   Wearcast — 지도에서 목적지를 찍고, 출국~입국 날짜와 예산을 정하면
   날마다 날씨에 맞는 코디를 추천하고, 필요한 옷을 무신사에서 예산 안에
   고를 수 있도록 검색 링크를 만들어주는 여행 코디 플래너.

   날씨: Open-Meteo (키 불필요, 브라우저에서 바로 호출 가능)
   지도/지오코딩: OpenStreetMap 타일 + Nominatim
   옷 쇼핑: 무신사 검색 링크로 연결 (musinsa.com은 공개 상품 API가 없어
   가격까지 자동 조회하진 못하고, 검색 결과로 바로 이동시켜준다)
   ──────────────────────────────────────────────────────────────── */

/* ── 손으로 그린 미니 아이콘 세트 (외부 아이콘 라이브러리 의존 없음) ── */
function IconBase({ children, size = 16, color = "currentColor", style }) {
  return (
    <svg width={size} height={size} viewBox="0 0 24 24" fill="none"
      stroke={color} strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round" style={style}>
      {children}
    </svg>
  );
}
const SunIcon = (p) => <IconBase {...p}><circle cx="12" cy="12" r="4" />
  <path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1" /></IconBase>;
const CloudBase = () => <>
  <circle cx="8.5" cy="14" r="3.6" fill="currentColor" stroke="none" />
  <circle cx="13" cy="10.8" r="4.6" fill="currentColor" stroke="none" />
  <circle cx="16.8" cy="14" r="3.2" fill="currentColor" stroke="none" />
  <rect x="5" y="13.6" width="14" height="5" rx="2.5" fill="currentColor" stroke="none" />
</>;
const CloudIcon = (p) => <IconBase {...p}><CloudBase /></IconBase>;
const CloudRainIcon = (p) => <IconBase {...p}><CloudBase /><path d="M9 20l-1 2M13 20l-1 2M17 20l-1 2" /></IconBase>;
const CloudSnowIcon = (p) => <IconBase {...p}><CloudBase /><circle cx="9" cy="21" r=".6" fill="currentColor" /><circle cx="13" cy="21" r=".6" fill="currentColor" /><circle cx="17" cy="21" r=".6" fill="currentColor" /></IconBase>;
const CloudLightningIcon = (p) => <IconBase {...p}><CloudBase /><path d="M13 19l-3 5h4l-3 5" /></IconBase>;
const CloudFogIcon = (p) => <IconBase {...p}><CloudBase /><path d="M5 20h14M6 22.5h12" /></IconBase>;
const MapPinIcon = (p) => <IconBase {...p}><path d="M12 21s7-6.5 7-11.5A7 7 0 0 0 5 9.5C5 14.5 12 21 12 21z" /><circle cx="12" cy="9.5" r="2.3" /></IconBase>;
const SearchIcon = (p) => <IconBase {...p}><circle cx="11" cy="11" r="7" /><line x1="21" y1="21" x2="16.6" y2="16.6" /></IconBase>;
const LoaderIcon = (p) => <IconBase {...p}><circle cx="12" cy="12" r="9" opacity="0.25" /><path d="M12 3a9 9 0 0 1 9 9" /></IconBase>;
const AlertIcon = (p) => <IconBase {...p}><circle cx="12" cy="12" r="9" /><line x1="12" y1="8" x2="12" y2="12.5" /><circle cx="12" cy="16" r=".6" fill="currentColor" /></IconBase>;
const BagIcon = (p) => <IconBase {...p}><path d="M6 8h12l-1 13H7L6 8z" /><path d="M9 8V6a3 3 0 0 1 6 0v2" /></IconBase>;
const WalletIcon = (p) => <IconBase {...p}><rect x="3" y="6" width="18" height="13" rx="2" /><path d="M3 10h18" /><circle cx="17" cy="14.2" r="1" fill="currentColor" /></IconBase>;
const ExternalLinkIcon = (p) => <IconBase {...p}><path d="M14 4h6v6" /><line x1="10" y1="14" x2="20" y2="4" /><path d="M19 13v6a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1h6" /></IconBase>;
const PlaneIcon = (p) => <IconBase {...p}><path d="M3 11l18-8-8 18-2-8-8-2z" fill="currentColor" stroke="none" /></IconBase>;

const CONDITION_ICON = {
  0: SunIcon, 1: SunIcon, 2: CloudIcon, 3: CloudIcon,
  45: CloudFogIcon, 48: CloudFogIcon,
  51: CloudRainIcon, 53: CloudRainIcon, 55: CloudRainIcon,
  61: CloudRainIcon, 63: CloudRainIcon, 65: CloudRainIcon,
  71: CloudSnowIcon, 73: CloudSnowIcon, 75: CloudSnowIcon,
  80: CloudRainIcon, 81: CloudRainIcon, 82: CloudRainIcon,
  95: CloudLightningIcon, 96: CloudLightningIcon, 99: CloudLightningIcon,
};
const CONDITION_LABEL = {
  0: "맑음", 1: "대체로 맑음", 2: "구름 조금", 3: "흐림",
  45: "안개", 48: "짙은 안개", 51: "가랑비", 53: "이슬비", 55: "이슬비(강)",
  61: "약한 비", 63: "비", 65: "강한 비", 71: "약한 눈", 73: "눈", 75: "강한 눈",
  80: "소나기", 81: "소나기(강)", 82: "폭우성 소나기",
  95: "뇌우", 96: "뇌우+우박", 99: "강한 뇌우+우박",
};
const iconFor = (code) => CONDITION_ICON[code] || CloudIcon;
const labelFor = (code) => CONDITION_LABEL[code] || "정보 없음";

// 체감 평균기온(최고/최저 평균) 구간별 코디 규칙
const OUTFIT_RULES = [
  { min: 28, outer: "없음", top: "반팔 티셔츠", bottom: "린넨 반바지", shoes: "샌들" },
  { min: 23, outer: "얇은 셔츠", top: "반팔 · 얇은 셔츠", bottom: "면바지", shoes: "스니커즈" },
  { min: 20, outer: "가디건", top: "긴팔 셔츠", bottom: "청바지", shoes: "스니커즈" },
  { min: 17, outer: "자켓", top: "니트", bottom: "청바지", shoes: "스니커즈" },
  { min: 12, outer: "트렌치코트", top: "기모 맨투맨", bottom: "두꺼운 팬츠", shoes: "부츠" },
  { min: 9, outer: "울 코트", top: "니트", bottom: "기모 바지", shoes: "부츠" },
  { min: 5, outer: "두꺼운 코트", top: "기모 후드", bottom: "두꺼운 청바지", shoes: "방한 부츠" },
  { min: -99, outer: "롱패딩", top: "기모 니트", bottom: "기모 안감 팬츠", shoes: "털 부츠" },
];
const pickTier = (avgTemp) => OUTFIT_RULES.find((r) => avgTemp >= r.min) || OUTFIT_RULES[OUTFIT_RULES.length - 1];

const CATEGORY_WEIGHT = { 아우터: 0.35, 상의: 0.2, 하의: 0.25, 신발: 0.2 };
const CATEGORY_KEY = { outer: "아우터", top: "상의", bottom: "하의", shoes: "신발" };

const iso = (d) => d.toISOString().slice(0, 10);
const today = () => { const d = new Date(); d.setHours(0, 0, 0, 0); return d; };
const addDays = (d, n) => { const c = new Date(d); c.setDate(c.getDate() + n); return c; };
const dayDiff = (a, b) => Math.round((b - a) / 86400000);
const fmtKo = (d) => `${d.getMonth() + 1}.${d.getDate()} (${"일월화수목금토"[d.getDay()]})`;
const fmtWon = (n) => `${Math.round(n).toLocaleString("ko-KR")}원`;
const musinsaLink = (keyword) => `https://www.musinsa.com/search/goods?keyword=${encodeURIComponent(keyword)}`;

const PIN_SVG = `
<svg width="30" height="42" viewBox="0 0 30 42" xmlns="http://www.w3.org/2000/svg">
  <path d="M15 0C6.7 0 0 6.7 0 15c0 10.5 15 27 15 27s15-16.5 15-27C30 6.7 23.3 0 15 0z" fill="#3C5A48"/>
  <circle cx="15" cy="15" r="6" fill="#FAFAF7"/>
</svg>`;

function App() {
  const mapDivRef = useRef(null);
  const mapRef = useRef(null);
  const markerRef = useRef(null);
  const [leafletReady, setLeafletReady] = useState(false);

  const [pin, setPin] = useState(null);
  const [placeName, setPlaceName] = useState("");
  const [geoLoading, setGeoLoading] = useState(false);

  const [mapQuery, setMapQuery] = useState("");
  const [mapSearching, setMapSearching] = useState(false);
  const [mapSearchError, setMapSearchError] = useState("");

  const [depart, setDepart] = useState(iso(addDays(today(), 5)));
  const [ret, setRet] = useState(iso(addDays(today(), 8)));
  const [budget, setBudget] = useState(300000);

  const [days, setDays] = useState(null);
  const [shoppingList, setShoppingList] = useState(null);
  const [planLoading, setPlanLoading] = useState(false);
  const [planError, setPlanError] = useState("");

  useEffect(() => {
    if (!mapDivRef.current || mapRef.current || !window.L) return;
    const L = window.L;
    const map = L.map(mapDivRef.current, { zoomControl: true }).setView([20, 20], 2);
    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
      attribution: "&copy; OpenStreetMap",
      maxZoom: 18,
    }).addTo(map);
    map.on("click", (e) => handlePinDrop(e.latlng.lat, e.latlng.lng));
    mapRef.current = map;
    setLeafletReady(true);
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, []);

  const placePin = useCallback((lat, lon) => {
    const L = window.L;
    if (!mapRef.current || !L) return;
    if (markerRef.current) {
      markerRef.current.setLatLng([lat, lon]);
    } else {
      const icon = L.divIcon({ html: PIN_SVG, className: "ac-pin", iconSize: [30, 42], iconAnchor: [15, 42] });
      markerRef.current = L.marker([lat, lon], { icon }).addTo(mapRef.current);
    }
  }, []);

  async function handlePinDrop(lat, lon) {
    setPin({ lat, lon });
    placePin(lat, lon);
    setGeoLoading(true);
    setPlaceName("");
    try {
      const res = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lon}&zoom=10&accept-language=ko`);
      const data = await res.json();
      const a = data.address || {};
      const city = a.city || a.town || a.village || a.county || a.state || "";
      const country = a.country || "";
      setPlaceName([city, country].filter(Boolean).join(", ") || data.display_name || `${lat.toFixed(2)}, ${lon.toFixed(2)}`);
    } catch {
      setPlaceName(`${lat.toFixed(2)}, ${lon.toFixed(2)}`);
    } finally {
      setGeoLoading(false);
    }
  }

  async function searchOnMap() {
    if (!mapQuery.trim() || !mapRef.current) return;
    setMapSearching(true);
    setMapSearchError("");
    try {
      const res = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(mapQuery.trim())}&limit=1&accept-language=ko`);
      const data = await res.json();
      if (!data || data.length === 0) {
        setMapSearchError(`"${mapQuery}"를 찾지 못했어요. 다른 이름으로 시도해보세요.`);
        return;
      }
      const { lat, lon } = data[0];
      mapRef.current.setView([+lat, +lon], 10);
      await handlePinDrop(+lat, +lon);
    } catch {
      setMapSearchError("검색에 실패했어요. 잠시 후 다시 시도해주세요.");
    } finally {
      setMapSearching(false);
    }
  }

  async function buildPlan() {
    setPlanError("");
    setDays(null);
    setShoppingList(null);

    if (!pin) { setPlanError("지도에서 여행지를 먼저 찍어주세요."); return; }
    const dStart = new Date(depart + "T00:00:00");
    const dEnd = new Date(ret + "T00:00:00");
    const tripLen = dayDiff(dStart, dEnd) + 1;
    if (tripLen < 1) { setPlanError("입국일은 출국일보다 늦어야 해요."); return; }
    if (tripLen > 21) { setPlanError("최대 21일 일정까지 지원돼요. 기간을 줄여주세요."); return; }

    setPlanLoading(true);
    try {
      const dateList = Array.from({ length: tripLen }, (_, i) => addDays(dStart, i));
      const t0 = today();

      const dayResults = await Promise.all(
        dateList.map(async (d) => {
          const ds = iso(d);
          const ahead = dayDiff(t0, d);
          if (ahead >= 0 && ahead <= 15) {
            const url = `https://api.open-meteo.com/v1/forecast?latitude=${pin.lat}&longitude=${pin.lon}` +
              `&daily=temperature_2m_max,temperature_2m_min,precipitation_probability_max,weathercode,windspeed_10m_max` +
              `&timezone=auto&start_date=${ds}&end_date=${ds}`;
            const res = await fetch(url);
            if (res.ok) {
              const data = await res.json();
              const dd = data.daily;
              if (dd && dd.time && dd.time.length) {
                return {
                  date: d, mode: "forecast",
                  max: dd.temperature_2m_max[0], min: dd.temperature_2m_min[0],
                  precip: dd.precipitation_probability_max ? dd.precipitation_probability_max[0] : null,
                  code: dd.weathercode[0],
                };
              }
            }
          }
          // 예보 범위 밖 → 최근 3개년 같은 날짜 평균 (평년 기후 추정)
          const years = [1, 2, 3].map((n) => d.getFullYear() - n);
          const mm = String(d.getMonth() + 1).padStart(2, "0");
          const dd2 = String(d.getDate()).padStart(2, "0");
          const hist = await Promise.all(
            years.map(async (y) => {
              const hd = `${y}-${mm}-${dd2}`;
              const url = `https://archive-api.open-meteo.com/v1/archive?latitude=${pin.lat}&longitude=${pin.lon}` +
                `&start_date=${hd}&end_date=${hd}&daily=temperature_2m_max,temperature_2m_min,precipitation_sum,weathercode&timezone=auto`;
              const res = await fetch(url);
              if (!res.ok) return null;
              const data = await res.json();
              const dd3 = data.daily;
              if (!dd3 || !dd3.time || !dd3.time.length) return null;
              return { max: dd3.temperature_2m_max[0], min: dd3.temperature_2m_min[0], precip: dd3.precipitation_sum[0], code: dd3.weathercode[0] };
            })
          );
          const valid = hist.filter(Boolean);
          if (valid.length === 0) {
            return { date: d, mode: "unknown", max: 22, min: 14, precip: null, code: 2 };
          }
          const avg = (arr) => arr.reduce((a, b) => a + b, 0) / arr.length;
          return {
            date: d, mode: "climate",
            max: avg(valid.map((v) => v.max)), min: avg(valid.map((v) => v.min)),
            precip: Math.round((valid.filter((v) => v.precip > 1).length / valid.length) * 100),
            code: valid[0].code,
          };
        })
      );

      const withTier = dayResults.map((r) => {
        const avgTemp = (r.max + r.min) / 2;
        return { ...r, avgTemp, tier: pickTier(avgTemp) };
      });
      setDays(withTier);
      setShoppingList(buildShoppingList(withTier, budget));
    } catch (e) {
      setPlanError("날씨 정보를 가져오지 못했어요. 네트워크 상태를 확인하고 다시 시도해주세요.");
    } finally {
      setPlanLoading(false);
    }
  }

  function buildShoppingList(dayList, totalBudget) {
    const catKeys = ["outer", "top", "bottom", "shoes"];
    const distinct = { outer: new Set(), top: new Set(), bottom: new Set(), shoes: new Set() };
    dayList.forEach((d) => {
      catKeys.forEach((k) => { if (d.tier[k] && d.tier[k] !== "없음") distinct[k].add(d.tier[k]); });
    });
    const items = [];
    catKeys.forEach((k) => {
      const names = [...distinct[k]];
      if (names.length === 0) return;
      const catBudget = totalBudget * CATEGORY_WEIGHT[k];
      const perItem = catBudget / names.length;
      names.forEach((name) => items.push({ category: CATEGORY_KEY[k], name, budget: perItem }));
    });
    return items.sort((a, b) => b.budget - a.budget);
  }

  const totalSpend = useMemo(() => (shoppingList ? shoppingList.reduce((s, i) => s + i.budget, 0) : 0), [shoppingList]);

  return (
    <div style={S.page}>
      <div style={S.wrap}>
        <header style={S.header}>
          <div style={S.eyebrow}>WEARCAST · 여행 코디 플래너</div>
          <h1 style={S.title}>지도를 찍고, 날짜와 예산을 정하면</h1>
          <p style={S.subtitle}>출국부터 입국까지, 날마다 입을 옷을 날씨에 맞춰 추천하고 무신사에서 바로 찾아드려요.</p>
        </header>

        <section style={S.block}>
          <div style={S.blockHead}><span style={S.stepNum}>01</span><span style={S.blockTitle}>여행지 선택</span></div>
          <div style={S.mapSearchRow}>
            <div style={S.inputWrap}>
              <SearchIcon size={14} color="#9A9A90" />
              <input style={S.input} placeholder="지도에서 찾기 (예: 후쿠오카, Lisbon)" value={mapQuery}
                onChange={(e) => setMapQuery(e.target.value)}
                onKeyDown={(e) => e.key === "Enter" && searchOnMap()} />
            </div>
            <button style={S.smallBtn} onClick={searchOnMap} disabled={mapSearching}>
              {mapSearching ? <LoaderIcon size={14} className="spin" /> : "이동"}
            </button>
          </div>
          {mapSearchError && <Note icon={<AlertIcon size={13} />} text={mapSearchError} tone="error" />}

          <div ref={mapDivRef} style={S.map}>
            {!leafletReady && <div style={S.mapLoading}><LoaderIcon size={20} color="#9A9A90" className="spin" /></div>}
          </div>
          <p style={S.mapHint}>지도를 클릭하면 그 자리에 핀이 꽂혀요.</p>
          {pin && <div style={S.pinChip}><MapPinIcon size={13} color="#3C5A48" />{geoLoading ? "위치 확인 중…" : placeName}</div>}
        </section>

        <section style={S.block}>
          <div style={S.blockHead}><span style={S.stepNum}>02</span><span style={S.blockTitle}>일정 · 예산</span></div>
          <div style={S.row2}>
            <Field label="출국일"><input type="date" style={S.input} value={depart} min={iso(today())} onChange={(e) => setDepart(e.target.value)} /></Field>
            <Field label="입국일"><input type="date" style={S.input} value={ret} min={depart} onChange={(e) => setRet(e.target.value)} /></Field>
          </div>
          <Field label="옷 구매 예산" style={{ marginTop: 16 }}>
            <div style={S.inputWrap}>
              <WalletIcon size={14} color="#9A9A90" />
              <input type="number" min={0} step={10000} style={S.input} value={budget}
                onChange={(e) => setBudget(Math.max(0, Number(e.target.value)))} />
              <span style={S.wonSuffix}>원</span>
            </div>
          </Field>
          <div style={S.presetRow}>
            {[100000, 200000, 300000, 500000].map((v) => (
              <button key={v} style={S.presetBtn(budget === v)} onClick={() => setBudget(v)}>{(v / 10000).toFixed(0)}만</button>
            ))}
          </div>
          <button style={S.primaryBtn} onClick={buildPlan} disabled={planLoading}>
            {planLoading ? <><LoaderIcon size={15} className="spin" /> 날씨 분석 중…</> : "코디 플랜 만들기"}
          </button>
          {planError && <Note icon={<AlertIcon size={13} />} text={planError} tone="error" />}
        </section>

        {days && shoppingList && (
          <>
            <section style={S.block}>
              <div style={S.blockHead}><span style={S.stepNum}>03</span><span style={S.blockTitle}>날짜별 코디</span></div>
              <div style={S.dayList}>
                {days.map((d, i) => {
                  const Icon = iconFor(d.code);
                  return (
                    <div key={i} style={S.dayRow}>
                      <div style={S.dayDate}>{i === 0 && <PlaneIcon size={12} color="#9A9A90" style={{ marginRight: 4 }} />}{fmtKo(d.date)}</div>
                      <div style={S.dayWeather}>
                        <Icon size={15} color="#17181A" />
                        <span style={S.mono}>{Math.round(d.min)}° / {Math.round(d.max)}°</span>
                        {d.mode === "climate" && <span style={S.badge}>평년</span>}
                      </div>
                      <div style={S.dayOutfit}>
                        {[d.tier.outer, d.tier.top, d.tier.bottom, d.tier.shoes].filter((v) => v && v !== "없음").join(" · ")}
                      </div>
                    </div>
                  );
                })}
              </div>
            </section>

            <section style={S.block}>
              <div style={S.blockHead}><span style={S.stepNum}>04</span><span style={S.blockTitle}>쇼핑 리스트</span></div>
              <p style={S.shoppingIntro}>여행 기간 동안 겹치는 옷은 한 벌씩만 계산했어요. 예산 {fmtWon(budget)} 중 약 {fmtWon(totalSpend)}을 배분했어요.</p>
              <div style={S.shopList}>
                {shoppingList.map((item, i) => (
                  <a key={i} href={musinsaLink(item.name)} target="_blank" rel="noopener noreferrer" style={S.shopRow}>
                    <div>
                      <span style={S.shopCategory}>{item.category}</span>
                      <div style={S.shopName}>{item.name}</div>
                    </div>
                    <div style={S.shopRight}>
                      <span style={S.mono}>{fmtWon(item.budget)}</span>
                      <span style={S.shopLink}>무신사에서 보기 <ExternalLinkIcon size={12} /></span>
                    </div>
                  </a>
                ))}
              </div>
              <p style={S.disclaimer}><BagIcon size={12} color="#9A9A90" /> 표시된 금액은 예산을 항목별로 나눈 참고 값이에요. 실제 상품 가격은 무신사 검색 결과에서 필터로 조정해 확인해주세요.</p>
            </section>
          </>
        )}
      </div>
    </div>
  );
}

function Field({ label, children, style }) {
  return <div style={style}><label style={S.label}>{label}</label>{children}</div>;
}
function Note({ icon, text, tone }) {
  return <div style={{ ...S.note, color: tone === "error" ? "#B6493D" : "#9A9A90" }}>{icon}<span>{text}</span></div>;
}

const S = {
  page: { minHeight: "100vh", background: "#FAFAF7", color: "#17181A", padding: "36px 16px" },
  wrap: { maxWidth: 640, margin: "0 auto" },
  header: { marginBottom: 32 },
  eyebrow: { fontFamily: "'IBM Plex Mono', monospace", fontSize: 11, letterSpacing: "0.08em", color: "#3C5A48", marginBottom: 10 },
  title: { fontSize: "clamp(22px,4vw,28px)", fontWeight: 700, margin: "0 0 8px", lineHeight: 1.4 },
  subtitle: { fontSize: 13.5, color: "#9A9A90", margin: 0, lineHeight: 1.6, maxWidth: 480 },
  block: { padding: "26px 0", borderTop: "1px solid #E6E4DC" },
  blockHead: { display: "flex", alignItems: "baseline", gap: 8, marginBottom: 16 },
  stepNum: { fontFamily: "'IBM Plex Mono', monospace", fontSize: 11, color: "#9A9A90" },
  blockTitle: { fontSize: 15, fontWeight: 700 },
  mapSearchRow: { display: "flex", gap: 8, marginBottom: 10 },
  inputWrap: { display: "flex", alignItems: "center", gap: 8, background: "#FFFFFF", border: "1px solid #E6E4DC", borderRadius: 8, padding: "9px 12px", flex: 1 },
  input: { border: "none", outline: "none", background: "transparent", fontSize: 13.5, fontFamily: "inherit", color: "#17181A", width: "100%" },
  wonSuffix: { fontSize: 12.5, color: "#9A9A90", whiteSpace: "nowrap" },
  smallBtn: { border: "1px solid #E6E4DC", background: "#FFFFFF", borderRadius: 8, padding: "0 16px", fontSize: 13, cursor: "pointer", color: "#17181A" },
  map: { width: "100%", height: 300, borderRadius: 10, overflow: "hidden", border: "1px solid #E6E4DC", position: "relative", background: "#EFEEE8" },
  mapLoading: { position: "absolute", inset: 0, display: "flex", alignItems: "center", justifyContent: "center" },
  mapHint: { fontSize: 11.5, color: "#9A9A90", marginTop: 8 },
  pinChip: { marginTop: 10, display: "inline-flex", alignItems: "center", gap: 6, fontSize: 12.5, background: "#EEF2ED", color: "#3C5A48", borderRadius: 999, padding: "5px 12px" },
  row2: { display: "flex", gap: 12 },
  label: { display: "block", fontSize: 11.5, color: "#9A9A90", marginBottom: 6 },
  presetRow: { display: "flex", gap: 8, marginTop: 8 },
  presetBtn: (active) => ({ border: `1px solid ${active ? "#3C5A48" : "#E6E4DC"}`, background: active ? "#EEF2ED" : "#FFFFFF", color: active ? "#3C5A48" : "#9A9A90", borderRadius: 999, padding: "5px 13px", fontSize: 12, cursor: "pointer" }),
  primaryBtn: { marginTop: 20, width: "100%", background: "#17181A", color: "#fff", border: "none", borderRadius: 8, padding: "13px 16px", fontSize: 14, fontWeight: 700, cursor: "pointer", display: "flex", alignItems: "center", justifyContent: "center", gap: 8 },
  note: { display: "flex", alignItems: "flex-start", gap: 6, fontSize: 12.5, marginTop: 10, lineHeight: 1.5 },
  dayList: { display: "flex", flexDirection: "column" },
  dayRow: { display: "grid", gridTemplateColumns: "78px 92px 1fr", alignItems: "center", gap: 10, padding: "10px 0", borderBottom: "1px solid #E6E4DC" },
  dayDate: { fontFamily: "'IBM Plex Mono', monospace", fontSize: 12.5, color: "#17181A", display: "flex", alignItems: "center" },
  dayWeather: { display: "flex", alignItems: "center", gap: 5 },
  mono: { fontFamily: "'IBM Plex Mono', monospace", fontSize: 12 },
  badge: { fontSize: 9.5, color: "#9A9A90", border: "1px solid #E6E4DC", borderRadius: 4, padding: "1px 4px" },
  dayOutfit: { fontSize: 12.5, color: "#17181A" },
  shoppingIntro: { fontSize: 12.5, color: "#9A9A90", lineHeight: 1.6, marginBottom: 14 },
  shopList: { display: "flex", flexDirection: "column" },
  shopRow: { display: "flex", justifyContent: "space-between", alignItems: "center", padding: "13px 0", borderBottom: "1px solid #E6E4DC", cursor: "pointer" },
  shopCategory: { fontSize: 10.5, color: "#3C5A48", background: "#EEF2ED", borderRadius: 4, padding: "2px 6px" },
  shopName: { fontSize: 14, fontWeight: 500, marginTop: 5, color: "#17181A" },
  shopRight: { display: "flex", flexDirection: "column", alignItems: "flex-end", gap: 4 },
  shopLink: { display: "inline-flex", alignItems: "center", gap: 4, fontSize: 11.5, color: "#9A9A90" },

};

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
